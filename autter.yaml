  checkAuthSessionExpirationChangedEnabled: true
  checkAuthPasswordResetFlowChangedEnabled: true
  checkAuthOauthCallbackChangedEnabled: true
  checkAuthWebhookSignatureMissingEnabled: true
  checkAuthPublicRoutePrivateDataEnabled: true
  checkDbMigrationEnabled: true
  checkDbLiveVerificationEnabled: true
  checkDbDropTableEnabled: true
  checkDbDropColumnEnabled: true
  checkDbTypeNarrowingEnabled: true
  checkDbConstraintRemovedEnabled: true
  checkDbIndexRemovedEnabled: true
  checkDbNullabilityTightenedEnabled: true
  checkDbNullabilityRelaxedEnabled: true
  checkDbDefaultChangedEnabled: true
  checkDbPrimaryKeyChangedEnabled: true
  checkDbForeignKeyChangedEnabled: true
  checkDbUniqueConstraintRemovedEnabled: true
  checkDbEnumValueRemovedEnabled: true
  checkDbColumnRenameNoCompatEnabled: true
