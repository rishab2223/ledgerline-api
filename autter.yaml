version: 1
settings:
  prReviewEnabled: true
  reviewSensitivity: medium
  commentVerbosity: balanced
  reviewIncrementalCommits: true
  reviewDraftPrs: false
  allowBotPrReviews: false
  autoResolveThreads: true
  showFeedback: true
  mergeConfidence: true
  autoApprove: disabled
  prCustomInstructions: "- Every authenticated route in src/app.ts must be registered after
    app.use(rateLimit(...)) so it is rate limited per API key. Only /health may be exempt. Flag any
    route mounted between apiKeyAuth and rateLimit as a blocking finding."
  ignoreRules: []
  docPackages: []
  checkTooManyFilesEnabled: true
  checkTooManyFilesThreshold: 50
  checkTooManyLinesEnabled: true
  checkTooManyLinesThreshold: 1000
  checkTooManyChaptersEnabled: true
  checkTooManyChaptersThreshold: 6
  checkMixedConcernsEnabled: true
  checkMigrationUiLogicEnabled: true
  checkGeneratedFilesEnabled: true
  checkMissingContextEnabled: true
  reviewabilityHardBlock: false
  blockConfirmedFindings: true
  reviewDepthAdaptive: true
  checkSensitiveLogsEnabled: true
  checkMissingAuditLogEnabled: true
  checkLogInjectionEnabled: true
  checkRemovedObservabilityEnabled: true
  checkLoggingInlineCommentsEnabled: true
  checkPrReviewabilityFindingsEnabled: true
  checkPolicyEngineEnabled: true
  checkPolicyLinkedIssueEnabled: true
  checkPolicyCodeownerReviewEnabled: true
  checkPolicySecurityReviewEnabled: true
  checkPolicySecuritySensitivePaths: auth/,billing/,payments/,security/,secrets/,crypto/
  checkPolicySecurityTeamLogins: ""
  checkPolicyTestsForSourceEnabled: true
  checkPolicyMigrationRollbackEnabled: true
  checkPolicySignedCommitsEnabled: false
  checkArchitectureEnabled: true
  checkArchFrontendToDbEnabled: true
  checkArchRouteToDbEnabled: true
  checkArchServiceToUiEnabled: true
  checkArchDomainBoundaryEnabled: true
  checkArchPackageRuleEnabled: true
  checkArchForbiddenPackages: ""
  checkArchLoggingPatternEnabled: true
  checkArchErrorHandlingEnabled: true
  checkArchValidationLibraryEnabled: true
  checkArchTransactionWrapperEnabled: true
  checkArchFeatureFlagEnabled: true
  checkArchWrongPlacementEnabled: true
  checkArchEnvVarConventionEnabled: true
  checkAiSlopEnabled: true
  checkAiSlopHallucinatedImportEnabled: true
  checkAiSlopNonexistentPackageEnabled: true
  checkAiSlopNonexistentFunctionEnabled: true
  checkAiSlopGenericPlaceholderEnabled: true
  checkAiSlopRepetitiveBoilerplateEnabled: true
  checkAiSlopOverbroadTryCatchEnabled: true
  checkAiSlopTodoCriticalPathEnabled: true
  checkAiSlopFakeCommentEnabled: true
  checkAiSlopUnusedAbstractionEnabled: true
  checkAiSlopStyleMismatchEnabled: true
  checkAiSlopPatternMismatchEnabled: true
  checkAiSlopBrokenEdgeCaseEnabled: true
  checkAiSlopInsecureDocExampleEnabled: true
  checkAiSlopExcessiveVolumeEnabled: false
  checkAiSlopDeadCodeEnabled: true
  checkAiSlopDeprecatedApiEnabled: true
  checkAiSlopWrongVersionUsageEnabled: true
  checkApiContractEnabled: true
  checkApiEndpointRemovedEnabled: true
  checkApiMethodChangedEnabled: true
  checkApiRequiredFieldAddedEnabled: true
  checkApiResponseFieldRemovedEnabled: true
  checkApiResponseTypeChangedEnabled: true
  checkApiStatusCodeChangedEnabled: true
  checkApiAuthRequirementChangedEnabled: true
  checkApiErrorShapeChangedEnabled: true
  checkApiPaginationChangedEnabled: true
  checkApiWebhookPayloadChangedEnabled: true
  checkApiGraphqlFieldRemovedEnabled: true
  checkApiGraphqlEnumRemovedEnabled: true
  checkApiSdkExportRemovedEnabled: false
  checkSecretDetectionEnabled: true
  checkCicdSecurityEnabled: true
  checkCicdPrTargetRiskEnabled: true
  checkCicdSecretsToForksEnabled: true
  checkCicdOverbroadTokenEnabled: true
  checkCicdUnpinnedActionsEnabled: true
  checkCicdActionPublisherAllowlist: ""
  checkCicdShellInjectionEnabled: true
  checkCicdUnsafeCacheEnabled: true
  checkCicdDeploymentChangesEnabled: true
  checkCicdDeploymentPathPatterns: ""
  checkCicdEnvProtectionEnabled: true
  checkAuthPermissionEnabled: true
  checkAuthMiddlewareRemovedEnabled: true
  checkAuthRouteProtectionChangedEnabled: true
  checkAuthPermissionCheckRemovedEnabled: true
  checkAuthRoleCheckWeakenedEnabled: true
  checkAuthAdminRouteExposedEnabled: true
